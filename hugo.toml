# publishDir = "docs"

baseURL = "https://tqc-conference.org/"
languageCode = "en"
title = "TQC Conference Website"

# Theme: github.com/IAQI/conference-theme, shared by the QCrypt, TQC and QIP
# websites (layouts, styles, schedule and accepted-papers templates, scripts).
# The version is pinned in go.mod / go.sum and downloaded at build time
# (Netlify needs Go for this: GO_VERSION in netlify.toml). Update it with
# `hugo mod get -u github.com/IAQI/conference-theme`.
# This site's own files in layouts/, assets/, i18n/ override the module's;
# this year's colours are in assets/style/theme-YEAR.scss.
[module]
  [[module.imports]]
    path = "github.com/IAQI/conference-theme"

# Params
enableEmoji = true
enableRobotsTXT = true
enableMissingTranslationPlaceholders = true

# Google Analytics are currently disabled, 
# using it would officially require a cookie banner at least in the EU, and we don't have one...
# it's probably better not to track people anyways.
# GoogleAnalytics = "G-221GMGECQ6"

# [services]
#   [services.googleAnalytics]
#     id = "G-221GMGECQ6"

[params]
    programScheduleSpeakers = false
    title = "TQC Conference Website"
    date = "2026-09-15"
    currentYear = 2026
    description = "International Conference on Theory of Quantum Computation, Communication and Cryptography (TQC)"
    images = ["/images/social-share.jpg"]
    email = "2026@tqc-conference.org"
    keywords = "event, quantum computation, communication, cryptography, TQC"
    copyright = "We :heart: quantum"
    copyright_link = "https://github.com/IAQI/tqc-website"
    # cfpUrl = "/2024/call"
    # subscriptionUrl = ""
    appleTouchIcon = "/apple-touch-icon.png"
    favicon32 = "/favicon-32x32.png"
    favicon16 = "/favicon-16x16.png"
    manifest = "/site.webmanifest"
    # safariPinnedTab = "/safari-pinned-tab.svg"

[params.2026]
  city = "Sherbrooke, Canada"
  timeanddate_cityid = 1221
  themeColor = "#74C5DE" # same as --primary in assets/style/theme-2026.scss
  [params.2026.logos]
    jumbo = "/images/2026/background-2026.jpg"
    header = "/images/2026/logo-2026.png"
    banner = "/images/2026/banner-2026.png"

[params.logos]
    footer = "/images/logos/netlify-color-accent.svg"
    footer_link = "https://www.netlify.com"

[server]
  [[server.redirects]]
      from = "/"
      to = "/2026/"
      status = 302
      force = true 

[languages]
[languages.en]
    weight = 1
    languageName = "us"

[taxonomies]
    tag = "tags"

[markup]
[markup.goldmark]
[markup.goldmark.renderer]
unsafe = true

[privacy]
    [privacy.disqus]
        disable = true
    [privacy.googleAnalytics]
        anonymizeIP = false
        disable = false
        respectDoNotTrack = false
        useSessionStorage = false
    [privacy.instagram]
        disable = true
        simple = false
    [privacy.twitter]
        disable = false
        enableDNT = false
        simple = false
    [privacy.vimeo]
        disable = true
        simple = false
    [privacy.youtube]
        disable = true
        privacyEnhanced = true

  [[menu.2026]]
    name = "Home"
    weight = 10
    identifier = "home"
    pageRef = '/2026'
  [[menu.2026]]
    name = "Technical Program"
    weight = 20
    identifier = "technical-program"
  [[menu.2026]]
    name = "Schedule"
    weight = 25
    identifier = "schedule"
    pageRef = "/2026/schedule"
  [[menu.2026]]
    name = "Attend"
    weight = 30
    identifier = "attend"
  [[menu.2026]]
    name = "Sponsors"
    weight = 40
    identifier = "sponsors"
    pageRef = "/2026/partners"
  [[menu.2026]]
    name = "Committees"
    weight = 50
    identifier = "committees"
    pageRef = "/2026/team"
